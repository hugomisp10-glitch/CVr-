<!doctype html><html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mapas · Cabo Verde</title>
<meta name="theme-color" content="#04283a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌴%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px system-ui,sans-serif;color:#1a2b1f;display:flex;flex-direction:column;overflow:hidden;background:#04283a}
header{background:linear-gradient(155deg,#04283a,#0a3c53 60%,#0e6a73);color:#fff;padding:10px 12px;box-shadow:0 4px 14px #0004;z-index:3}
body.embed h1{display:none}
h1{font:700 20px Georgia,serif;margin:0 0 8px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.ch{flex:none;border:1px solid #fff4;background:#ffffff18;color:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;white-space:nowrap}
.ch.on{background:#f2a154;color:#2b1c07;border-color:#f2a154;font-weight:700}
#wrap{flex:1;position:relative;min-height:0}
svg{position:absolute;inset:0;width:100%;height:100%}
.poi{cursor:pointer}.poi circle{fill:#fff;stroke:#0e8a86;stroke-width:2.5}.poi:active circle{fill:#ffe3bd}
.poi text{font-size:11px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lb{font:700 9px system-ui;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#04283acc;stroke-width:2.6px;pointer-events:none}
.isl{cursor:pointer}
#shc{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#fffaf1;border-radius:16px;padding:13px 15px;box-shadow:0 8px 28px #0007;max-height:42%;overflow:auto}
#shc h2{font:700 17px Georgia,serif;margin:0 0 4px;color:#0a6a67}#shc p{margin:4px 0;font-size:13.5px;color:#48594d;line-height:1.5}
#shc a,#shc button{display:inline-block;margin:6px 6px 0 0;border:0;border-radius:999px;padding:8px 14px;font:700 12.5px system-ui;background:#2f9e6e;color:#fff;text-decoration:none}
#shc button{background:#e8dcc0;color:#3a2107}
.hint{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:11px;color:#fff;opacity:.85;pointer-events:none}
</style></head><body>
<header><h1>🌴 Mapas de Cabo Verde</h1><div class="row" id="chips"></div></header>
<div id="wrap"><svg id="svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"></svg><div class="hint">Ilustração · posições aproximadas, não à escala</div><div id="shc"></div></div>
<script>
const mt=(x,y,s,c)=>`<path d="M${x-s} ${y}L${x} ${y-s*1.5}L${x+s} ${y}Z" fill="${c}" opacity=".85"/>`;
const du=(x,y,w)=>`<path d="M${x} ${y}q${w/2} ${-w/3} ${w} 0" stroke="#b98a3e" stroke-width="2" fill="none" opacity=".55"/>`;
const I={
sal:{n:'Ilha do Sal',em:'🏖️',c:'#ecc983',s:'#c9a257',
 p:'M195 20C225 30 240 60 238 95C252 125 256 165 244 205C238 235 224 262 205 275C180 268 168 235 172 200C166 160 168 120 176 92C170 60 172 30 195 20Z',
 info:'Alternativa 1 · Resorts all inclusive em Santa Maria. Aeroporto em Espargos, ~15–20 min de transfer.',
 deco:du(190,215,24)+du(205,190,20)+'<ellipse cx="236" cy="134" rx="7" ry="4" fill="#fff" opacity=".85"/>',
 pois:[['✈️','Aeroporto Amílcar Cabral (SID)',222,172,'Chegada e partida. Transfer para Santa Maria ~15–20 min.'],
 ['🏘️','Espargos',200,150,'Capital da ilha, mercado municipal e ruas coloridas.'],
 ['🏖️','Santa Maria',200,262,'Praia de areal branco, resorts all inclusive e restaurantes.'],
 ['🦈','Shark Bay',224,248,'Água rasa junto ao cais — pequenos tubarões-limão inofensivos.'],
 ['⛰️','Monte Leão',182,238,'Antigo cone vulcânico com vista sobre a ilha.'],
 ['💎','Salinas de Pedra de Lume',238,128,'Cratera vulcânica com lago hipersalgado — banho flutuante.'],
 ['💙','Buracona (Olho Azul)',190,68,'Piscina natural com luz turquesa ao meio-dia.'],
 ['🎣','Palmeira',180,122,'Vila de pescadores, antigo porto do sal.'],
 ['🏜️','Deserto de Viana / Terra Boa',216,205,'Excursão de jipe pelo interior desértico.']]},
boavista:{n:'Boa Vista',em:'🐢',c:'#f0c07a',s:'#d99450',
 p:'M110 90C150 50 250 50 300 90C330 130 320 200 270 230C220 255 140 250 110 210C80 170 80 120 110 90Z',
 info:'Alternativa 2 · Dunas, aldeia fantasma, flamingos e desova de tartarugas (jun–out). Aeroporto em Rabil.',
 deco:du(140,170,30)+du(165,185,26)+du(150,158,22)+'<ellipse cx="205" cy="150" rx="14" ry="6" fill="#8fd3d6" opacity=".8"/>',
 pois:[['⛵','Sal Rei',150,100,'Vila principal, porto e restaurantes. Resorts por perto.'],
 ['🏖️','Praia de Chaves',118,142,'Praia extensa e selvagem, junto aos resorts.'],
 ['✈️','Aeroporto de Rabil (BVC)',222,112,'Transfer ~5–15 min até Sal Rei / Chaves.'],
 ['⛪','Rabil & Lagoa de Rabil',200,138,'Vila histórica e lagoa com flamingos-rosa.'],
 ['🏜️','Deserto de Viana',152,188,'Dunas brancas que avançam sobre a paisagem.'],
 ['👻','Curral Velho',255,226,'Aldeia piscatória abandonada junto ao mar.'],
 ['🐢','Ilhéu do Baluarte',128,66,'Reserva marinha ao largo de Sal Rei — snorkel e tartarugas.'],
 ['⚓','Naufrágio Cabo Santa Maria',290,120,'Navio encalhado em 1968, na Praia de Atalanta (posição aproximada).']]},
santiago:{n:'Santiago',em:'🏛️',c:'#8fcf9e',s:'#4a9c76',
 p:'M200 20C230 30 240 70 235 110C250 150 245 200 230 240C215 275 195 280 185 255C170 220 175 180 165 140C160 100 170 50 200 20Z',
 info:'Alternativa 3 · Praia (capital) e Cidade Velha, Património UNESCO. Aeroporto RAI a ~2 km do centro.',
 deco:mt(190,100,12,'#2d6b4f')+mt(212,92,14,'#2d6b4f')+mt(200,150,11,'#3f8a63')+mt(210,175,9,'#3f8a63'),
 pois:[['🏖️','Tarrafal',208,38,'Uma das melhores praias de Santiago, a norte.'],
 ['⛰️','Serra Malagueta',215,96,'Parque natural com trilhos entre montanhas verdes.'],
 ['🧺','Assomada',200,130,'Mercado colorido do interior da ilha.'],
 ['🏛️','Cidade Velha',190,262,'Património Mundial UNESCO, primeira cidade europeia nos trópicos.'],
 ['🏙️','Praia · Plateau',222,262,'Capital e centro histórico, praça Alexandre Albuquerque.'],
 ['✈️','Aeroporto Nelson Mandela (RAI)',238,236,'Chegada à Praia, ~10 min do Plateau.']]},
saovicente:{n:'São Vicente',em:'🎶',c:'#c9a6e8',s:'#8c5fc0',
 p:'M110 110C150 70 250 70 290 110C310 150 290 210 240 225C190 240 130 220 110 180C100 150 100 125 110 110Z',
 info:'Alternativa 3 · Mindelo, cidade da morna e de Cesária Évora. Aeroporto VXE a ~10 min do centro.',
 deco:mt(215,125,16,'#6a4399')+mt(240,135,11,'#6a4399')+mt(185,140,10,'#7a52a8'),
 pois:[['🎶','Mindelo',140,132,'Centro histórico, mercado municipal, marginal e música ao vivo.'],
 ['⛴️','Porto de Mindelo (ferry)',124,110,'Barco para Santo Antão, ~1h de travessia.'],
 ['⛰️','Monte Verde',218,112,'Ponto mais alto da ilha, vista panorâmica.'],
 ['🏊','Baía das Gatas',292,168,'Piscina natural formada por rocha vulcânica.'],
 ['✈️','Aeroporto Cesária Évora (VXE)',205,205,'Voo doméstico desde a Praia (~45 min).'],
 ['🏖️','Praia da Laginha',150,150,'Praia urbana de Mindelo, junto aos hotéis.']]},
santoantao:{n:'Santo Antão',em:'🌄',c:'#9fd08a',s:'#4a8a4f',
 p:'M60 190C90 110 170 60 260 60C320 70 350 110 340 160C320 210 260 240 190 245C130 250 70 240 60 190Z',
 info:'Alternativa 3 · Excursão de dia inteiro a partir de Mindelo: barco, vales e trilhos de montanha.',
 deco:mt(150,150,18,'#2d6b4f')+mt(190,120,22,'#2d6b4f')+mt(240,135,18,'#3f8a63')+mt(280,150,14,'#3f8a63')+'<path d="M120 215Q200 150 295 105" stroke="#fff" stroke-width="2" stroke-dasharray="4 3" fill="none" opacity=".8"/>',
 pois:[['⛴️','Porto Novo',120,215,'Chegada do ferry de Mindelo.'],
 ['🌋','Cova de Paúl',200,135,'Cratera vulcânica cultivada, vista espetacular.'],
 ['🛣️','Estrada da Corda',250,140,'Uma das estradas de montanha mais espetaculares do arquipélago.'],
 ['🌱','Paul',292,108,'Vale verdejante com terraços agrícolas e cana-de-açúcar.'],
 ['📸','Fontainhas',320,84,'Vila encaixada no vale, das mais fotografadas do país.'],
 ['🏘️','Ribeira Grande',332,128,'Cidade principal do norte da ilha.']]}
};
const OV={santoantao:'translate(0 10) scale(.4)',saovicente:'translate(110 -5) scale(.32)',sal:'translate(180 0) scale(.45)',boavista:'translate(280 80) scale(.3)',santiago:'translate(60 100) scale(.5)'};
const LB={santoantao:[80,122],saovicente:[174,80],sal:[270,138],boavista:[340,172],santiago:[162,256]};
const $=id=>document.getElementById(id);let cur='all';
const gm=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const sea=`<defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25c3bb"/><stop offset=".55" stop-color="#0e8a9a"/><stop offset="1" stop-color="#074a63"/></linearGradient></defs>
<rect width="400" height="300" fill="url(#sea)"/><circle cx="360" cy="34" r="20" fill="#ffd28a"/><circle cx="360" cy="34" r="30" fill="#ffd28a" opacity=".25"/>
<g stroke="#fff" stroke-width="1.4" fill="none" opacity=".25"><path d="M20 70q10-6 20 0t20 0"/><path d="M330 250q10-6 20 0t20 0"/><path d="M30 255q10-6 20 0t20 0"/><path d="M300 190q10-6 20 0t20 0"/><path d="M70 30q10-6 20 0t20 0"/></g>
<text x="30" y="285" font-size="16">⛵</text><text x="365" y="285" font-size="14">🐬</text><text x="14" y="30" font-size="13" opacity=".9">🧭N</text>`;
const body=(k)=>{const d=I[k];return `<path d="${d.p}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="12" stroke-linejoin="round"/><path d="${d.p}" fill="${d.c}" stroke="${d.s}" stroke-width="2"/>${d.deco}`};
function render(){
 let h=sea;
 if(cur==='all'){
  Object.keys(I).forEach(k=>{h+=`<g class="isl" transform="${OV[k]}" onclick="go('${k}')">${body(k)}</g><text class="lb" x="${LB[k][0]}" y="${LB[k][1]}">${I[k].em} ${I[k].n}</text>`});
  $('shc').innerHTML=`<h2>🌴 Arquipélago de Cabo Verde</h2><p>Toquem numa ilha para ver o mapa com resorts, aeroportos, praias e passeios.</p>`;
 }else{
  const d=I[cur];h+=body(cur);
  d.pois.forEach((p,i)=>{h+=`<g class="poi" onclick="poi(${i})"><circle cx="${p[2]}" cy="${p[3]}" r="10"/><text x="${p[2]}" y="${p[3]+.5}">${p[0]}</text><text class="lb" x="${p[2]}" y="${p[3]+19}">${p[1].split(' (')[0].split(' · ')[0]}</text></g>`});
  $('shc').innerHTML=`<h2>${d.em} ${d.n}</h2><p>${d.info}</p><a target="_blank" rel="noopener" href="${gm(d.n+', Cabo Verde')}">🗺️ Abrir no Google Maps</a>`;
 }
 $('svg').innerHTML=h;
 document.querySelectorAll('.ch').forEach(c=>c.classList.toggle('on',c.dataset.k===cur));
}
function go(k){cur=k;render()}
function poi(i){const d=I[cur],p=d.pois[i];
 $('shc').innerHTML=`<h2>${p[0]} ${p[1]}</h2><p>${p[4]}</p><a target="_blank" rel="noopener" href="${gm(p[1]+', '+d.n+', Cabo Verde')}">🗺️ Ver no Google Maps</a><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p[1]+', '+d.n+', Cabo Verde')}">🚗 Como chegar</a><button onclick="go(cur)">← ${d.n}</button>`}
$('chips').innerHTML=`<button class="ch" data-k="all" onclick="go('all')">🌍 Arquipélago</button>`+Object.keys(I).map(k=>`<button class="ch" data-k="${k}" onclick="go('${k}')">${I[k].em} ${I[k].n}</button>`).join('');
const q=new URLSearchParams(location.search);if(q.get('embed'))document.body.classList.add('embed');
if(I[q.get('i')])cur=q.get('i');render();
</script></body></html>
